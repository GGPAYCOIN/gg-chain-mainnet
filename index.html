<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GGPAY Name Service (.ggpay)</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 50px; }
        .container { background: #333; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 15px #000; }
        input { padding: 12px; width: 250px; margin: 15px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { padding: 12px 25px; cursor: pointer; background: #f39c12; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; }
        button:hover { background: #e67e22; }
        a { color: #f39c12; text-decoration: none; }
        .footer { color: #777; font-size: 12px; margin-top: 25px; border-top: 1px solid #555; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 Register .ggpay Domain</h2>
        <p>Powered by <a href="#" target="_blank">GGPAY Mainnet Network</a></p>
        <button onclick="connect()">Connect MetaMask</button>
        <p id="walletInfo" style="color: #2ecc71;"></p>
        <hr style="border-color: #555;">
        <input type="text" id="domainInput" placeholder="Enter desired name (e.g., office)">
        <br>
        <button onclick="buyDomain()">Register (Fee: 1 GG)</button>
        
        <div class="footer">
            Developed and maintained by Mr. Roma
        </div>
    </div>

    <script>
        let web3; 
        let userAccount;
        const contractAddress = "0x0Ffe2b16878ea8e6BE36Ee46d49c441E5130cE66";
        
        const abi = [
            {
                "inputs": [{"internalType": "string","name": "_name","type": "string"}],
                "name": "register",
                "outputs": [],
                "stateMutability": "payable",
                "type": "function"
            }
        ];

        async function connect() {
            if (window.ethereum) {
                web3 = new Web3(window.ethereum);
                const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accounts[0];
                document.getElementById("walletInfo").innerText = "Connected: " + userAccount.substring(0,6) + "..." + userAccount.substring(38);
            } else {
                alert("Please install MetaMask!");
            }
        }

        async function buyDomain() {
            if (!userAccount) {
                alert("Please connect your wallet first!");
                return;
            }
            const name = document.getElementById("domainInput").value;
            const contract = new web3.eth.Contract(abi, contractAddress);
            
            try {
                // Here we added the gas limit manually to fix the MetaMask error
                await contract.methods.register(name).send({
                    from: userAccount,
                    value: web3.utils.toWei("1", "ether"),
                    gas: 3000000 
                });
                alert("Congratulations! " + name + ".ggpay is successfully registered to your wallet.");
            } catch (error) {
                console.error(error);
                alert("Transaction failed. Check console for details.");
            }
        }
    </script>
</body>
</html>
