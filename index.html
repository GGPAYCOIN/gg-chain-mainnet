<div id="domain-app">
    <h3>Buy your .ggpay Domain</h3>
    <input type="text" id="domainName" placeholder="Enter name (e.g. suman)">
    <button onclick="checkAndBuy()">Register & Pay 1 GG</button>
    <p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
    const contractAddress = "YOUR_NAMESERVICE_CONTRACT_ADDRESS";
    const abi = [ "function registerName(string memory name) public payable" ];

    async function checkAndBuy() {
        const name = document.getElementById('domainName').value;
        if(!name) return alert("Please enter a name");

        // Connect to MetaMask
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();

        const contract = new ethers.Contract(contractAddress, abi, signer);
        
        try {
            document.getElementById('status').innerText = "Processing transaction...";
            // Setting price as 1 GG (adjust based on your contract logic)
            const tx = await contract.registerName(name, { 
                value: ethers.utils.parseEther("1.0") 
            });
            await tx.wait();
            document.getElementById('status').innerText = "Success! " + name + ".ggpay is yours!";
        } catch (err) {
            console.error(err);
            document.getElementById('status').innerText = "Transaction failed!";
        }
    }
</script>
