<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGPAY Official Swap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e11; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1e2329; width: 100%; max-width: 420px; padding: 25px; border-radius: 24px; border: 1px solid #474d57; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .logo { color: #f3ba2f; font-size: 26px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .info-card { background: #2b3139; padding: 15px; border-radius: 16px; margin-bottom: 15px; border-left: 4px solid #f3ba2f; }
        .info-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .field { background: #0b0e11; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        input { background: transparent; border: none; color: white; font-size: 22px; width: 100%; outline: none; }
        .btn { width: 100%; background: #f3ba2f; color: black; border: none; padding: 18px; border-radius: 16px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #ffd25d; }
        #log-box { width: 100%; max-width: 420px; background: #000; color: #00ff00; font-family: monospace; font-size: 11px; padding: 12px; border-radius: 12px; margin-top: 15px; border: 1px solid #333; height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="box">
    <div class="logo">GGPAY SWAP</div>

    <div class="info-card">
        <div class="info-row"><span>Native Mined Coins (GG):</span> <span id="native-bal" style="color:#f3ba2f; font-weight:bold;">0.00</span></div>
        <div style="font-size: 11px; color: #8b949e;">These are your direct mining rewards</div>
    </div>
    
    <div class="field">
        <div class="info-row"><span>From (WGGPAY)</span> <span id="b1">Bal: 0.00</span></div>
        <input type="number" id="amt1" placeholder="0.0" oninput="calc()">
    </div>

    <div style="text-align: center; margin: -10px 0 5px 0; font-size: 20px; color: #474d57;">↓</div>

    <div class="field">
        <div class="info-row"><span>To (USDT)</span> <span id="b2">Bal: 0.00</span></div>
        <input type="number" id="amt2" placeholder="0.0" readonly>
    </div>

    <button class="btn" id="conBtn" onclick="connect()">Connect Wallet</button>
    <button class="btn" id="swapBtn" onclick="swap()" style="display:none;">Execute Swap</button>
</div>

<div id="log-box">System Status: Waiting for connection...</div>

<script>
    let provider, signer, user;
    const ROUTER = "0xDc23FCaA46412dbbf3468A4ABE4a4d48AfaD1595";
    const WGGPAY = "0x0Ea2C1D525bB40e4d80BB896AFbd023eC99A1140";
    const USDT = "0xf287c0922564c09bf11CeA0D4d9a294fFBee99C8";

    function log(m) {
        const lb = document.getElementById('log-box');
        lb.innerHTML += "<br>> " + m;
        lb.scrollTop = lb.scrollHeight;
    }

    async function connect() {
        if (!window.ethereum) return log("Error: Use MetaMask Browser!");
        try {
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            user = await signer.getAddress();
            
            document.getElementById('conBtn').style.display = "none";
            document.getElementById('swapBtn').style.display = "block";
            log("Connected to Wallet: " + user.slice(0,6) + "...");
            loadData();
        } catch (e) { log("Connection Failed!"); }
    }

    async function loadData() {
        try {
            // 1. Load Native Mined Balance
            const nativeBal = await provider.getBalance(user);
            document.getElementById('native-bal').innerText = ethers.utils.formatEther(nativeBal);

            // 2. Load Token Balances
            const abi = ["function balanceOf(address) view returns (uint256)"];
            const c1 = new ethers.Contract(WGGPAY, abi, provider);
            const c2 = new ethers.Contract(USDT, abi, provider);
            
            const b1 = await c1.balanceOf(user);
            const b2 = await c2.balanceOf(user);
            
            document.getElementById('b1').innerText = "Bal: " + ethers.utils.formatEther(b1);
            document.getElementById('b2').innerText = "Bal: " + ethers.utils.formatEther(b2);
            log("All balances synced successfully.");
        } catch (e) { log("Data Sync Error! Check RPC."); }
    }

    function calc() {
        document.getElementById('amt2').value = (document.getElementById('amt1').value * 1.90).toFixed(4);
    }

    async function swap() {
        const val = document.getElementById('amt1').value;
        if (!val || val <= 0) return log("Enter valid amount!");
        
        const amount = ethers.utils.parseEther(val);
        const abiE = ["function approve(address,uint256) returns (bool)"];
        const abiR = ["function swap(address,address,uint256,uint256,address)"];
        
        try {
            log("Step 1: Approving WGGPAY...");
            const t1 = new ethers.Contract(WGGPAY, abiE, signer);
            const tx1 = await t1.approve(ROUTER, amount);
            await tx1.wait();
            
            log("Step 2: Executing Swap...");
            const r = new ethers.Contract(ROUTER, abiR, signer);
            const tx2 = await r.swap(WGGPAY, USDT, amount, 0, user);
            await tx2.wait();
            
            log("Swap Success! 🎉");
            loadData();
        } catch (e) { log("Swap Failed!"); }
    }
</script>
</body>
</html>
