<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGPAY Official Swap & Wrap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080a0c; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #12161c; width: 100%; max-width: 420px; padding: 25px; border-radius: 24px; border: 1px solid #2d333b; box-shadow: 0 10px 50px rgba(0,0,0,0.7); }
        .logo { color: #f39c12; font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .info-card { background: #1c2128; padding: 15px; border-radius: 16px; margin-bottom: 15px; border-left: 4px solid #f39c12; }
        .field { background: #080a0c; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #30363d; }
        input { background: transparent; border: none; color: white; font-size: 22px; width: 100%; outline: none; }
        .btn { width: 100%; background: linear-gradient(90deg, #f39c12, #e67e22); border: none; padding: 16px; border-radius: 16px; font-weight: bold; font-size: 18px; cursor: pointer; color: black; margin-top: 10px; }
        .wrap-btn { background: #2d333b; color: #f39c12; font-size: 14px; padding: 10px; border-radius: 10px; border: 1px solid #f39c12; cursor: pointer; width: 100%; margin-top: 5px; }
        #log-box { width: 100%; max-width: 420px; background: #000; color: #00ff00; font-family: monospace; font-size: 11px; padding: 12px; border-radius: 12px; margin-top: 15px; border: 1px solid #333; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="box">
    <div class="logo">GGPAY SWAP</div>

    <div class="info-card">
        <div style="display: flex; justify-content: space-between;"><span>Mined GG (Native):</span> <span id="native-bal" style="color:#f39c12;">0.00</span></div>
        <button class="wrap-btn" onclick="wrapGG()">Convert GG to WGGPAY (Wrap)</button>
    </div>
    
    <div class="field">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8b949e;"><span>From (WGGPAY)</span> <span id="b1">Bal: 0.00</span></div>
        <input type="number" id="amt1" placeholder="0.0" oninput="calc()">
    </div>

    <div style="text-align: center; color: #8b949e; margin: -5px 0 5px 0;">↓</div>

    <div class="field">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8b949e;"><span>To (USDT)</span> <span id="b2">Bal: 0.00</span></div>
        <input type="number" id="amt2" placeholder="0.0" readonly>
    </div>

    <button class="btn" id="conBtn" onclick="connect()">Connect Wallet</button>
    <button class="btn" id="swapBtn" onclick="swap()" style="display:none;">Execute Swap</button>
</div>

<div id="log-box">System Status: Waiting...</div>

<script>
    let provider, signer, user;
    const ROUTER = "0xDc23FCaA46412dbbf3468A4ABE4a4d48AfaD1595";
    const WGGPAY = "0x0Ea2C1D525bB40e4d80BB896AFbd023eC99A1140";
    const USDT = "0xf287c0922564c09bf11CeA0D4d9a294fFBee99C8";

    function log(m) {
        const lb = document.getElementById('log-box');
        lb.innerHTML += "<br>> " + m;
        lb.scrollTop = lb.scrollHeight;
    }

    async function connect() {
        if (!window.ethereum) return alert("Open in MetaMask!");
        try {
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            user = await signer.getAddress();
            document.getElementById('conBtn').style.display = "none";
            document.getElementById('swapBtn').style.display = "block";
            log("Connected: " + user.slice(0,6));
            loadData();
        } catch (e) { log("Connection Failed"); }
    }

    async function loadData() {
        if (!user) return;
        try {
            const nBal = await provider.getBalance(user);
            document.getElementById('native-bal').innerText = parseFloat(ethers.utils.formatEther(nBal)).toFixed(4);
            
            const abi = ["function balanceOf(address) view returns (uint256)"];
            const c1 = new ethers.Contract(WGGPAY, abi, provider);
            const c2 = new ethers.Contract(USDT, abi, provider);
            
            const b1 = await c1.balanceOf(user);
            const b2 = await c2.balanceOf(user);
            
            document.getElementById('b1').innerText = "Bal: " + parseFloat(ethers.utils.formatEther(b1)).toFixed(4);
            document.getElementById('b2').innerText = "Bal: " + parseFloat(ethers.utils.formatEther(b2)).toFixed(4);
            log("Balances updated.");
        } catch (e) { log("Sync error. Checking network..."); }
    }

    function calc() {
        document.getElementById('amt2').value = (document.getElementById('amt1').value * 1.90).toFixed(4);
    }

    async function wrapGG() {
        const amt = prompt("How many GG to Wrap?");
        if(!amt) return;
        const tx = await signer.sendTransaction({ to: WGGPAY, value: ethers.utils.parseEther(amt) });
        log("Wrapping GG...");
        await tx.wait();
        log("Wrap Success! 🎉");
        loadData();
    }

    async function swap() {
        const val = document.getElementById('amt1').value;
        const amount = ethers.utils.parseEther(val || "0");
        const abiE = ["function approve(address,uint256) returns (bool)"];
        const abiR = ["function swap(address,address,uint256,uint256,address)"];
        
        try {
            log("Step 1: Approving...");
            const tx1 = await new ethers.Contract(WGGPAY, abiE, signer).approve(ROUTER, amount);
            await tx1.wait();
            log("Step 2: Swapping...");
            const tx2 = await new ethers.Contract(ROUTER, abiR, signer).swap(WGGPAY, USDT, amount, 0, user);
            await tx2.wait();
            log("Swap Done! 🚀");
            loadData();
        } catch (e) { log("Swap Failed: Check Balance!"); }
    }
</script>
</body>
</html>
