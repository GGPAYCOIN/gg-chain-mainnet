<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGPAY Official DEX</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #080a0c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .swap-card { background: #12161c; width: 400px; padding: 25px; border-radius: 24px; border: 1px solid #2d333b; box-shadow: 0 10px 50px rgba(0,0,0,0.7); }
        .logo { color: #f39c12; font-size: 26px; font-weight: bold; margin-bottom: 25px; text-align: center; }
        .input-box { background: #1c2128; padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1px solid transparent; transition: 0.3s; }
        .input-box:focus-within { border-color: #f39c12; }
        input { background: transparent; border: none; color: white; font-size: 24px; width: 100%; outline: none; font-weight: 600; }
        .label-info { display: flex; justify-content: space-between; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
        .btn { width: 100%; background: linear-gradient(90deg, #f39c12, #e67e22); border: none; padding: 16px; border-radius: 16px; font-weight: bold; font-size: 18px; cursor: pointer; color: black; margin-top: 15px; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3); }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        #status-msg { font-size: 12px; color: #f39c12; margin-top: 20px; text-align: center; background: rgba(243, 156, 18, 0.1); padding: 10px; border-radius: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="swap-card">
    <div class="logo">GGPAY SWAP PRO</div>
    
    <div class="input-box">
        <div class="label-info"><span>From (WGGPAY)</span> <span id="bal1">Balance: 0.0</span></div>
        <input type="number" id="inAmt" placeholder="0.0" oninput="calculate()">
    </div>

    <div style="text-align: center; margin: -5px 0 5px 0; color: #8b949e; font-size: 20px;">↓</div>

    <div class="input-box">
        <div class="label-info"><span>To (USDT)</span> <span id="bal2">Balance: 0.0</span></div>
        <input type="number" id="outAmt" placeholder="0.0" readonly>
    </div>

    <button class="btn" id="mainBtn" onclick="connectWallet()">Connect Wallet</button>
    <div id="status-msg">Welcome to GGPAY Mainnet</div>
</div>

<script>
    let web3, user;
    const ROUTER = "0xDc23FCaA46412dbbf3468A4ABE4a4d48AfaD1595";
    const WGGPAY = "0x0Ea2C1D525bB40e4d80BB896AFbd023eC99A1140";
    const USDT = "0xf287c0922564c09bf11CeA0D4d9a294fFBee99C8";
    const CHAIN_ID = "0x205D58"; // Hex for 2121216

    async function checkNetwork() {
        const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (currentChainId !== CHAIN_ID) {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: CHAIN_ID }],
                });
            } catch (err) {
                if (err.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: CHAIN_ID,
                            chainName: 'GGPAY Mainnet',
                            nativeCurrency: { name: 'GGPAY', symbol: 'GG', decimals: 18 },
                            rpcUrls: ['https://rpc.ggtaps.world'], // আপনার আরপিসি লিংকটি এখানে নিশ্চিত করুন
                            blockExplorerUrls: ['https://ggtaps.world']
                        }]
                    });
                }
            }
        }
    }

    async function connectWallet() {
        if (!window.ethereum) return alert("MetaMask not found!");
        await checkNetwork();
        web3 = new Web3(window.ethereum);
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        user = accounts[0];
        document.getElementById('mainBtn').innerText = "Swap Now";
        document.getElementById('mainBtn').onclick = startSwap;
        loadData();
    }

    async function loadData() {
        const abi = [{"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"}];
        try {
            const c1 = new web3.eth.Contract(abi, WGGPAY);
            const c2 = new web3.eth.Contract(abi, USDT);
            const b1 = await c1.methods.balanceOf(user).call();
            const b2 = await c2.methods.balanceOf(user).call();
            document.getElementById('bal1').innerText = "Balance: " + (b1/1e18).toFixed(4);
            document.getElementById('bal2').innerText = "Balance: " + (b2/1e18).toFixed(4);
            document.getElementById('status-msg').innerText = "System Live: 1 WGGPAY = 1.90 USDT";
        } catch(e) { document.getElementById('status-msg').innerText = "Error: Cannot read chain data!"; }
    }

    function calculate() {
        document.getElementById('outAmt').value = (document.getElementById('inAmt').value * 1.90).toFixed(4);
    }

    async function startSwap() {
        const amount = web3.utils.toWei(document.getElementById('inAmt').value, 'ether');
        const abiE = [{"inputs":[{"name":"s","type":"address"},{"name":"v","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"type":"function"}];
        const abiR = [{"inputs":[{"name":"a","type":"address"},{"name":"b","type":"address"},{"name":"ai","type":"uint256"},{"name":"ao","type":"uint256"},{"name":"to","type":"address"}],"name":"swap","outputs":[],"type":"function"}];
        
        try {
            document.getElementById('status-msg').innerText = "Step 1/2: Approving Token...";
            await new web3.eth.Contract(abiE, WGGPAY).methods.approve(ROUTER, amount).send({from: user});
            document.getElementById('status-msg').innerText = "Step 2/2: Swapping...";
            await new web3.eth.Contract(abiR, ROUTER).methods.swap(WGGPAY, USDT, amount, 0, user).send({from: user});
            document.getElementById('status-msg').innerText = "Success! Transaction Mined. 🎉";
            loadData();
        } catch(e) { document.getElementById('status-msg').innerText = "Transaction Failed!"; }
    }
</script>
</body>
</html>
